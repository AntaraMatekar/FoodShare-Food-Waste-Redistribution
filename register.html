<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - FoodShare</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-light">


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center text-success mb-4">
                        Create Account
                    </h2>


                    {% with messages = get_flashed_messages() %}

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-warning">
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Register As
                            </label>

                            <select
                                name="role"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Role
                                </option>

                                <option value="donor">
                                    Food Donor
                                </option>

                                <option value="receiver">
                                    Food Receiver
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Register

                        </button>

                    </form>


                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </p>


                    <p class="text-center">

                        <a href="/">
                            ← Back to Home
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
